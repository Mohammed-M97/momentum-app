<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f1f1ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14150f" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Momentum</title>
    <script>
      /* Set language + direction before React paints, so there is no
         left-to-right flash for Arabic users. Mirrors lib/i18n.js. */
      (function () {
        try {
          var l = localStorage.getItem("momentum_lang");
          if (!l) l = (navigator.language || "").toLowerCase().indexOf("ar") === 0 ? "ar" : "en";
          document.documentElement.lang = l;
          document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
